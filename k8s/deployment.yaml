apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo-cloudz-inference
  labels:
    app: neo-cloudz-inference
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: neo-cloudz-inference
  template:
    metadata:
      labels:
        app: neo-cloudz-inference
    spec:
      containers:
        - name: inference-api
          image: neo-cloudz/inference:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: neo-cloudz-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
